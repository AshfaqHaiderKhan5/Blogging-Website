name: pr-validation
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  linting-job:
    runs-on: ubuntu-latest
    steps:
      - name: build-step 
        uses: actions/checkout@v4
      - name: instaling html hint  
        run: npm install --save-dev htmlhint
      - name: instaling style lint  
        run: npm install --save-dev stylelint
      - name: running html hint  
        run: npx htmlhint "**/*.html"
      - name: running style lint  
        run: npx stylelint "**/*.css"    

  build:
      name: Build
      runs-on: ubuntu-latest
      needs: linting # Ensure linting passes before building
      steps:
        - name: Checkout code
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v3
          with:
            node-version: '16' # Or a suitable version
        - name: Install dependencies
          run: npm install parcel
        - name: Build website
          run: npx parcel build index.html 