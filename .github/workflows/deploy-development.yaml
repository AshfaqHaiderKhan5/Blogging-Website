name: Deploy to GitHub Pages

on:
  push:
    branches:
      - develop  # Trigger on any push to the develop branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'  # Specify the Node.js version you want to use

      - name: Install dependencies
        run: npm install

      - name: Build the static website
        run: npx parcel build index.html --dist-dir dist --public-url ./  # Adjust the path if necessary

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist  # Path to the built files

  deploy:
    runs-on: ubuntu-latest
    needs: build  # Ensure the build job is completed before deploying

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}  # Use the GitHub token for authentication
          path: dist  # The folder containing the built files